<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#203f2a">
<title>大樹神獸</title>
<meta name="description" content="用遊戲的方式守護家附近的樹：守護祂、回報樹況，樹要被移除前所有守護者都會知道。AI 方舟計畫在市政 debug 松的作品。">
<!-- 分享預覽（OG）：圖由 docs/vote-campaign/cards/cards.html 的 og 卡輸出 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="大樹神獸">
<meta property="og:title" content="大樹神獸｜讓台北每棵樹都有一群守護祂的鄰居">
<meta property="og:description" content="用遊戲的方式守護家附近的樹。不用註冊，手機打開就能玩。">
<meta property="og:url" content="https://2026-debugwithpuma.tree-god.workers.dev/">
<meta property="og:image" content="https://2026-debugwithpuma.tree-god.workers.dev/assets/share/og-site.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="大樹神獸：讓台北每棵樹都有一群守護祂的鄰居">
<meta name="twitter:card" content="summary_large_image">
<!-- PWA：加到主畫面後全螢幕開啟。圖示說明見 design-system/assets/logos/app-icons/README.md -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="design-system/assets/logos/logo-emblem.svg">
<link rel="icon" type="image/png" sizes="32x32" href="design-system/assets/logos/app-icons/favicon-32.png">
<link rel="apple-touch-icon" href="design-system/assets/logos/app-icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大樹神獸">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="design-system/tokens.css">
<link rel="stylesheet" href="design-system/components.css">
<!-- 電腦版（1024px 以上、滑鼠操作）才套用；手機和平板維持 PWA 手機版 -->
<link rel="stylesheet" href="design-system/desktop.css">
<link rel="stylesheet" href="css/app.css">
<!-- 每個畫面各自一個樣式檔，兩個人同時開發才不會改到同一個檔案 -->
<link rel="stylesheet" href="css/report.css">
<link rel="stylesheet" href="css/notices.css">
<link rel="stylesheet" href="css/scan.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/collection.css">
<link rel="stylesheet" href="css/share.css">
<link rel="stylesheet" href="css/me.css">
<link rel="stylesheet" href="css/myevents.css">
<link rel="stylesheet" href="css/goals.css">
<link rel="stylesheet" href="css/regions.css">
<link rel="stylesheet" href="css/feedback.css">
</head>
<body class="dsh-root">
<!-- 電腦版的頂部導覽，取代底部導覽列；電腦上沒有掃描 -->
<header class="dsh-topnav">
  <a class="dsh-topnav__brand" href="#/"><img src="design-system/assets/logos/logo-horizontal.svg" alt="大樹神獸"></a>
  <nav aria-label="主要導覽">
    <ul class="dsh-topnav__links">
      <li><a class="dsh-topnav__item" href="#/" aria-current="page"><span class="dsh-nav__icon dsh-nav__icon--map" aria-hidden="true"></span>地圖</a></li>
      <li><a class="dsh-topnav__item" href="#/collection"><span class="dsh-nav__icon dsh-nav__icon--collection" aria-hidden="true"></span>圖鑑</a></li>
      <li><a class="dsh-topnav__item" href="#/notices"><span class="dsh-nav__icon dsh-nav__icon--bell" aria-hidden="true"></span>通知</a></li>
      <li><a class="dsh-topnav__item" href="#/me"><span class="dsh-nav__icon dsh-nav__icon--me" aria-hidden="true"></span>我的</a></li>
      <li><a class="dsh-topnav__item" href="about.html">關於我們</a></li>
    </ul>
  </nav>
</header>
<div class="app">
  <div id="map" class="map" aria-label="樹木地圖"></div>

  <!-- 搜尋與篩選 -->
  <div class="topbar">
    <div class="search-row">
      <label class="search" for="q">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="#26231f" stroke-width="2.5"/><path d="M13 13 L18 18" stroke="#26231f" stroke-width="2.5" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="搜尋樹名、樹種或地點" autocomplete="off">
      </label>
      <!-- 切換區域（js/regions.js）：按鈕上寫現在看的區域 -->
      <button type="button" class="rg-btn" id="region" aria-haspopup="dialog" aria-expanded="false" aria-controls="region-sheet">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15 C8 15 2.5 9.5 2.5 6 a5.5 5.5 0 0 1 11 0 C13.5 9.5 8 15 8 15 Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="6" r="1.8" fill="currentColor"/></svg>
        <span class="rg-btn__name">北平東路</span>
      </button>
    </div>
    <div class="filters" role="group" aria-label="篩選">
      <button type="button" class="cat-select" id="category" aria-haspopup="listbox" aria-expanded="false" aria-controls="category-menu" aria-label="樹種類別">所有樹種</button>
      <button type="button" class="chip" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="chip" data-filter="beast" aria-pressed="false">神獸</button>
      <button type="button" class="chip" data-filter="watch" aria-pressed="false">需關注</button>
      <button type="button" class="chip" data-filter="notice" aria-pressed="false">公示中</button>
    </div>
    <!-- 樹種類別選單：放在 .filters 外面，才不會被橫向捲動的 chip 列裁掉 -->
    <ul class="cat-menu" id="category-menu" role="listbox" aria-label="樹種類別" tabindex="-1" hidden></ul>
    <!-- 附近的樹：只在電腦版的左欄顯示 -->
    <h2 class="nearby-title">附近的樹</h2>
    <ul class="dsh-treelist nearby" id="nearby" aria-label="附近的樹"></ul>
  </div>

  <button type="button" class="locate" id="locate" aria-label="回到我的位置">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="#26231f" stroke-width="2.5"/><circle cx="11" cy="11" r="2.2" fill="#3f7a4a"/><path d="M11 1 V4 M11 18 V21 M1 11 H4 M18 11 H21" stroke="#26231f" stroke-width="2.5" stroke-linecap="round"/></svg>
  </button>
  <!-- 定位沒被採用時的提示（不在收錄範圍、沒拿到位置） -->
  <p class="locate-hint" id="locate-hint" role="status" aria-live="polite" hidden></p>

  <!-- 底部：樹卡＋導覽列 -->
  <div class="bottom">
    <article class="tree-card" id="card" hidden></article>
    <nav class="dsh-nav" aria-label="主要導覽">
      <a class="dsh-nav__item" href="#/" aria-current="page"><span class="dsh-nav__icon dsh-nav__icon--map" aria-hidden="true"></span>地圖</a>
      <a class="dsh-nav__item" href="#/collection"><span class="dsh-nav__icon dsh-nav__icon--collection" aria-hidden="true"></span>圖鑑</a>
      <span class="dsh-nav__item"><a class="dsh-nav__scan" href="#/scan" aria-label="掃描樹牌 QR code"><span class="dsh-nav__icon dsh-nav__icon--scan" aria-hidden="true"></span></a>掃描</span>
      <a class="dsh-nav__item" href="#/notices"><span class="dsh-nav__icon dsh-nav__icon--bell" aria-hidden="true"></span>通知</a>
      <a class="dsh-nav__item" href="#/me"><span class="dsh-nav__icon dsh-nav__icon--me" aria-hidden="true"></span>我的</a>
    </nav>
  </div>

  <!-- 載入中：寫在 HTML 裡，JS 還沒下載完就看得到。js/map.js 讀完樹資料、畫好底圖後收起 -->
  <div class="loading" id="loading" role="status" aria-live="polite">
    <img class="loading__beast" src="design-system/assets/character/beasts/xuxugong/healthy-icon.webp" alt="" width="112" height="112">
    <h2 class="loading__title">正在叫醒大樹神獸…</h2>
    <ul class="loading__steps">
      <li data-step="trees">讀取台北的樹木資料</li>
      <li data-step="map">畫出地圖</li>
    </ul>
    <p class="loading__hint">第一次打開要讀將近兩千棵樹，大約需要幾秒</p>
    <button type="button" class="dsh-btn dsh-btn--primary loading__retry" hidden onclick="location.reload()">重新整理</button>
  </div>

  <!-- 切換區域的底部選單，內容由 js/regions.js 畫 -->
  <div class="rg-sheet" id="region-sheet" hidden></div>

  <!-- 蓋在地圖上的全螢幕畫面：樹木頁、回報頁、通知頁…都畫在這裡，見 js/map.js 的 PAGES -->
  <section class="tree-page" id="page" hidden></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="js/marker.js"></script>
<script type="module" src="js/map.js"></script>
<script>
  // Service Worker 只能在 HTTPS 或本機（localhost）註冊
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Service Worker 註冊失敗', err));
  }
</script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "3ee7aa6b734f4ef18f1aa24e5d702836"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
